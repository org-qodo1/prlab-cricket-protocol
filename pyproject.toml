[project]
name = "cricket-protocol"
version = "1.0.0"
description = "Hop 0 ball-event contract. Scoring is the only interpreter of legality and wickets."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cricket_protocol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
